name: HK Docker Cleanup

# 悬空镜像清理。hk sudoers 仅免密白名单内的 `docker compose` 命令形态，
# 本 job 同时充当形态探测（PROBE 步骤逐个尝试，|| true 不阻断）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 1" # UTC 周一 21:00 = 北京时间周二 05:00

concurrency:
  group: hk-cleanup
  cancel-in-progress: false

jobs:
  prune-dangling-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.XIANYU_DEPLOY_HOST }}
      DIR: /home/mango/xianyu-auto-bot
    steps:
      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XIANYU_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write one-off cleanup override
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SSH_HOST" \
            'cat > $DIR/cleanup-override.yml <<'"'"'EOF'"'"'
          services:
            cleanup:
              image: docker:cli
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
              entrypoint: ["sh", "-c"]
              command: ["docker image prune -f; echo \"--- dangling images remaining:\"; docker images -f dangling=true -q | wc -l"]
          EOF'

      - name: PROBE sudoers shapes
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no $SSH_HOST"
          echo "=== probe1: deploy 原形态 pull（应通过）==="
          $SSH "sudo -n docker compose -f $DIR/docker-compose.yml pull" || echo "PROBE1=FAIL"
          echo "=== probe2: 绝对路径 + 追加 -f override run ==="
          $SSH "sudo -n docker compose -f $DIR/docker-compose.yml -f $DIR/cleanup-override.yml run --rm -T cleanup" || echo "PROBE2=FAIL"
          echo "=== probe3: -f 覆盖在前的 run 形态 ==="
          $SSH "cd $DIR && sudo -n docker compose -f cleanup-override.yml run --rm -T cleanup" || echo "PROBE3=FAIL"

      - name: Remove override
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SSH_HOST" \
            'rm -f $DIR/cleanup-override.yml'
