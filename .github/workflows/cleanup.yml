name: HK Docker Cleanup

# 悬空镜像清理。hk sudoers 仅免密白名单内的 `docker compose` 命令形态，
# 本 job 同时充当形态探测（PROBE 步骤逐个尝试，|| true 不阻断）。
# ⚠️ 当前 hk sudoers 只精确放行 deploy 用的 pull / up 两条命令，prune 实跑会
# 被拒（2026-09-05 PROBE 实测）。放行以下任一条目后，把 schedule 加回来：
#   mango ALL=(root) NOPASSWD: /usr/bin/docker image prune -f
#   （或 compose run + docker.sock 挂载方案：放宽到 `docker compose` 通配）
on:
  workflow_dispatch:

concurrency:
  group: hk-cleanup
  cancel-in-progress: false

jobs:
  prune-dangling-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.XIANYU_DEPLOY_HOST }}
      DIR: /home/mango/xianyu-auto-bot
    steps:
      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XIANYU_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write one-off cleanup override
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SSH_HOST" \
            'cat > /home/mango/xianyu-auto-bot/cleanup-override.yml <<'"'"'EOF'"'"'
          services:
            cleanup:
              image: docker:cli
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
              entrypoint: ["sh", "-c"]
              command: ["docker image prune -f; echo \"--- dangling images remaining:\"; docker images -f dangling=true -q | wc -l"]
          EOF'

      - name: PROBE sudoers shapes
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no $SSH_HOST"
          echo "=== probe1: deploy 原形态 pull（应通过）==="
          $SSH "sudo -n docker compose -f /home/mango/xianyu-auto-bot/docker-compose.yml pull" || echo "PROBE1=FAIL"
          echo "=== probe2: 绝对路径 + 追加 -f override run ==="
          $SSH "sudo -n docker compose -f /home/mango/xianyu-auto-bot/docker-compose.yml -f /home/mango/xianyu-auto-bot/cleanup-override.yml run --rm -T cleanup" || echo "PROBE2=FAIL"
          echo "=== probe3: -f 覆盖在前的 run 形态 ==="
          $SSH "cd /home/mango/xianyu-auto-bot && sudo -n docker compose -f cleanup-override.yml run --rm -T cleanup" || echo "PROBE3=FAIL"

      - name: Remove override
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$SSH_HOST" \
            'rm -f /home/mango/xianyu-auto-bot/cleanup-override.yml'
