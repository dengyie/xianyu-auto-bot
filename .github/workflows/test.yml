name: Test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PATH: ':memory:'
      SQL_LOG_ENABLED: 'false'
      # 禁止 DrissionPage/远程滑块拉真浏览器；pytest-timeout 杀不掉 Chromium 连接线程
      XY_SLIDER_DRISSION_FALLBACK: 'false'
      XY_SLIDER_REMOTE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
          python-version: '3.11'

      # execjs / xianyu_utils 在 import 期需要 Node 运行时
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create virtual environment
        run: |
          uv venv .venv --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify dependency lock
        run: |
          uv pip compile requirements.txt \
            --python-version 3.11 \
            --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes \
            --no-emit-package slidex \
            --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Install dependencies
        run: |
          # 必须装进项目 venv，禁止 --system（runner 系统 Python 受 PEP 668 保护）
          uv pip install --python .venv/bin/python --require-hashes -r requirements.lock
          uv pip install --python .venv/bin/python --no-deps \
            "slidex @ git+https://github.com/dengyie/slidex.git@d4d372ba7554795bed8cb71c31b4d481366db99f"
          python -c "import sys; print(sys.executable); assert sys.version_info[:2] == (3, 11), sys.version"
          node --version
          python -c "import execjs; print('js_runtime=', execjs.get().name)"

      - name: Prepare runtime directories
        run: mkdir -p logs data backups static/uploads/images trajectory_history

      - name: Run test suite
        # 硬超时防止无日志卡死；失败时保留 junit 便于定位
        run: |
          set -o pipefail
          timeout --signal=KILL 480 python -m pytest -q --tb=line --durations=25 --junitxml=test-results.xml

      - name: Compile Python sources
        run: python -m compileall -q -f .

      # compileall 只查语法，查不出未定义名（历史潜伏 NameError 均漏过）；
      # 只把 F821 当门禁，未用导入等其余提示不阻塞
      - name: Undefined-name guard (pyflakes F821)
        run: |
          uv pip install --python .venv/bin/python --quiet pyflakes
          if python -m pyflakes *.py utils/*.py db_manager/*.py app/*.py app/api/*.py app/api/routers/*.py app/application/*/*.py app/domain/*/*.py | grep "undefined name"; then
            echo "::error::undefined names detected (F821)"
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            test-results.xml
            logs/
          if-no-files-found: ignore
